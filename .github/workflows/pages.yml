name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎日 0:05（日本時間）に作り直し、日付を過ぎた活動予定を表示から外す
    - cron: '5 15 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 大きな写真を公開用に縮小するためだけに使う（無くてもページは作れる）
      - name: Install Pillow
        run: pip install Pillow==11.1.0 || echo "Pillow could not be installed; large photos will be used as-is"
      # content/ のデータを site-src/templates/ の完成版デザインに差し込んで _site/ を作る
      - name: Build website
        run: python site-src/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
